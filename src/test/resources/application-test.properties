# Profil utilise pendant les tests automatises (./gradlew test) : base H2 en
# memoire, pour ne pas dependre d'une instance PostgreSQL locale.

spring.datasource.url=jdbc:h2:mem:beautyconnect-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

app.mail.fail-silently=true
