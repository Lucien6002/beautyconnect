# =========================================================
# BeautyConnect - configuration par defaut (profil dev)
# Toutes les valeurs sensibles sont surchargeables par variables
# d'environnement (voir README.md).
# =========================================================

spring.application.name=beautyconnect

# --- Base de donnees PostgreSQL ---
# Port 5433 par defaut : le 5432 standard est deja occupe par une instance
# PostgreSQL native sur cette machine (voir docker-compose.yml).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:beautyconnect}
spring.datasource.username=${DB_USER:beautyconnect}
spring.datasource.password=${DB_PASSWORD:beautyconnect}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# update : pratique pour la base du projet ; a remplacer par une
# vraie strategie de migration (Flyway/Liquibase) avant la prod.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# --- Thymeleaf ---
spring.thymeleaf.cache=false

# --- DevTools (redemarrage auto + LiveReload en dev) ---
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# --- Upload (photos de profil / realisations, base64 non utilise) ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# --- Mail ---
# Par défaut : Mailpit local (docker compose up -d), boîte de réception sur http://localhost:8025
# Pour envoyer de vrais mails (Mailjet), définir les variables d'environnement MAIL_*.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}

app.mail.from=${MAIL_FROM:no-reply@beautyconnect.local}
app.mail.fail-silently=${MAIL_FAIL_SILENTLY:true}

# ATTENTION : Mets l'e-mail que tu as validé à l'étape 2
app.mail.from=ulrichfosso246@gmail.com
app.mail.fail-silently=false

# --- Compte administrateur initial (cree au demarrage si absent) ---
app.admin.email=${ADMIN_EMAIL:admin@beautyconnect.local}
app.admin.password=${ADMIN_PASSWORD:Admin123!}

# --- Divers ---
server.error.include-message=always
logging.level.com.beautyconnect=DEBUG

# --- Jeton de verification (Connexion / 2FA) ---
app.security.token-expiration-minutes=15
