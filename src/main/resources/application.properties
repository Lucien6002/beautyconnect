spring.application.name=beautyconnect
spring.profiles.default=dev
spring.config.import=optional:file:.env[.properties],optional:file:.env.local[.properties]
server.port=${PORT:8080}
server.error.include-message=never
server.tomcat.accesslog.enabled=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:beautyconnect}}
spring.datasource.username=${DB_USER:beautyconnect}
spring.datasource.password=${DB_PASSWORD:beautyconnect}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.thymeleaf.cache=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:no-reply@beautyconnect.local}
app.mail.fail-silently=${MAIL_FAIL_SILENTLY:true}
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.security.token-expiration-minutes=${TOKEN_EXPIRATION_MINUTES:15}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.routing.api-key=${ORS_API_KEY:}
app.routing.base-url=${ORS_BASE_URL:https://api.openrouteservice.org}
app.routing.timeout-ms=5000
app.routing.requests-per-minute=${ORS_REQUESTS_PER_MINUTE:30}
app.routing.cache-seconds=300
app.map.tile-url=${MAP_TILE_URL:https://tile.openstreetmap.org/{z}/{x}/{y}.png}
