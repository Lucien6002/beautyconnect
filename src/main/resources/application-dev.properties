spring.thymeleaf.cache=false
app.admin.email=${ADMIN_EMAIL:admin@beautyconnect.local}
app.admin.password=${ADMIN_PASSWORD:Admin123!}

# Catalogue partagé automatiquement complété à chaque démarrage en dev.
# DEMO_FRANCE_ENABLED=false permet de désactiver explicitement cet import.
app.demo.france.enabled=${DEMO_FRANCE_ENABLED:true}

# Laisser le temps de parcourir et présenter le projet en développement.
server.servlet.session.timeout=${SESSION_TIMEOUT:2h}
