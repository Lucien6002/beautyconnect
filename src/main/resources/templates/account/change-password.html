<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head(title='Changer mon mot de passe')}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<main class="flex-grow-1 container my-5">
    <div class="row g-4">
    <div class="col-lg-4" sec:authorize="hasRole('CLIENT')">
        <aside th:replace="~{fragments/client-account :: sidebar('infos')}"></aside>
    </div>
    <div class="col" style="max-width: 640px;">
    <h1 class="h4 mb-4">Changer mon mot de passe</h1>

    <form th:action="@{/compte/mot-de-passe}" th:object="${passwordChangeForm}" method="post" class="card shadow-sm p-4">
        <div class="mb-3">
            <label class="form-label">Mot de passe actuel</label>
            <input type="password" th:field="*{currentPassword}" class="form-control" autocomplete="current-password"
                   th:classappend="${#fields.hasErrors('currentPassword')} ? 'is-invalid'" required/>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Nouveau mot de passe</label>
            <input type="password" th:field="*{newPassword}" class="form-control" autocomplete="new-password"
                   th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'" minlength="8" maxlength="72" required/>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
            <div class="form-text">8 caracteres minimum.</div>
        </div>
        <div class="mb-3">
            <label class="form-label">Confirmer le nouveau mot de passe</label>
            <input type="password" th:field="*{confirmPassword}" class="form-control" autocomplete="new-password"
                   th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'" required/>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
        </div>
        <button type="submit" class="btn btn-primary w-100">Modifier le mot de passe</button>
        <a th:href="@{/compte}" class="btn btn-link w-100 mt-2">Retour a mes informations</a>
    </form>
    </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
