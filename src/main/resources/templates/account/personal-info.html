<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Mon compte')}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<main class="flex-grow-1 container my-5" style="max-width: 640px;">
    <h1 class="h4 mb-4">Mes informations personnelles</h1>

    <form th:action="@{/compte}" th:object="${personalInfoForm}" method="post" class="card shadow-sm p-4">
        <div class="mb-3">
            <label class="form-label">Prenom</label>
            <input type="text" th:field="*{firstName}" class="form-control"
                   th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid'" maxlength="100" required/>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Nom</label>
            <input type="text" th:field="*{lastName}" class="form-control"
                   th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid'" maxlength="100" required/>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Telephone <span class="text-muted small">(optionnel)</span></label>
            <input type="tel" th:field="*{phone}" class="form-control"
                   th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'" maxlength="20"/>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" th:value="${email}" disabled/>
            <div class="form-text">L'email est votre identifiant de connexion et ne peut pas etre modifie ici.</div>
        </div>
        <button type="submit" class="btn btn-primary w-100">Enregistrer</button>
        <a th:href="@{/compte/mot-de-passe}" class="btn btn-outline-secondary w-100 mt-2">Changer mon mot de passe</a>
    </form>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
