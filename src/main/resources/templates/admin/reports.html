<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Signalements')}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<main class="flex-grow-1 container my-5">
    <h1 class="h4 mb-4">Signalements</h1>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table mb-0 align-middle">
                <thead>
                <tr><th>Type</th><th>Cible</th><th>Motif</th><th>Signale par</th><th>Statut</th><th>Actions</th></tr>
                </thead>
                <tbody>
                <tr th:each="r : ${reports}">
                    <td th:text="${r.targetType}"></td>
                    <td th:text="'#' + ${r.targetId}"></td>
                    <td class="small" th:text="${r.reason}"></td>
                    <td th:text="${r.reporter.fullName}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${r.status.name() == 'EN_ATTENTE'} ? 'text-bg-warning' : (${r.status.name() == 'TRAITE'} ? 'text-bg-success' : 'text-bg-secondary')"
                              th:text="${r.status}"></span>
                    </td>
                    <td class="d-flex gap-1" th:if="${r.status.name() == 'EN_ATTENTE'}">
                        <form th:action="@{'/admin/signalements/' + ${r.id} + '/traiter'}" method="post">
                            <button type="submit" class="btn btn-sm btn-success">Marquer traite</button>
                        </form>
                        <form th:action="@{'/admin/signalements/' + ${r.id} + '/rejeter'}" method="post">
                            <button type="submit" class="btn btn-sm btn-outline-secondary">Rejeter</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
            <p class="p-3 text-muted small mb-0" th:if="${#lists.isEmpty(reports)}">Aucun signalement.</p>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
