<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Moderation des avis')}"></head>
<body class="bc-admin-page">

<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<div class="container bc-workspace" data-role="admin">
<aside th:replace="~{fragments/workspace :: navigation(role='admin', active='reviews')}"></aside>
<main class="bc-workspace-main" id="main-content">
    <h1 class="h4 mb-4">Moderation des avis</h1>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table mb-0 align-middle">
                <thead>
                <tr><th>Professionnel</th><th>Client</th><th>Note</th><th>Type</th><th>Commentaire</th><th>Statut</th><th></th></tr>
                </thead>
                <tbody>
                <tr th:each="r : ${reviews}">
                    <td th:text="${r.professional.businessName}"></td>
                    <td th:text="${r.client.fullName}"></td>
                    <td th:text="${r.rating} + '/5'"></td>
                    <!-- Verifie = avis lie a un rendez-vous termine du client ;
                         Libre = avis sans rendez-vous (voir ReviewService.addReview).
                         Tester la reference ne charge pas le rendez-vous (LAZY). -->
                    <td>
                        <span class="badge" th:classappend="${r.appointment != null} ? 'text-bg-primary' : 'text-bg-light border'"
                              th:text="${r.appointment != null} ? 'Verifie' : 'Libre'"
                              th:title="${r.appointment != null} ? 'Lie a un rendez-vous termine' : 'Sans rendez-vous'"></span>
                    </td>
                    <td class="small" th:text="${r.comment}"></td>
                    <td>
                        <span class="badge" th:classappend="${r.hidden} ? 'text-bg-secondary' : 'text-bg-success'"
                              th:text="${r.hidden} ? 'Masque' : 'Visible'"></span>
                    </td>
                    <td>
                        <form th:if="${!r.hidden}" th:action="@{'/admin/avis/' + ${r.id} + '/masquer'}" method="post"
                              onsubmit="return confirm('Masquer cet avis ?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Masquer</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
            <p class="p-3 text-muted small mb-0" th:if="${#lists.isEmpty(reviews)}">Aucun avis pour le moment.</p>
        </div>
    </div>
</main>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
