<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Connexion')}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<main class="flex-grow-1 d-flex align-items-center">
    <div class="container" style="max-width: 480px;">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h4 mb-4 text-center">Connexion</h1>

                <!-- AJOUTE CE BLOC ICI : -->
                <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <span th:text="${success}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div th:if="${param.erreur}" class="alert alert-danger">
                    Email ou mot de passe incorrect.
                </div>
                <div th:if="${param.desactive}" class="alert alert-warning">
                    Votre compte a ete desactive par un administrateur.
                </div>
                <div th:if="${param.deconnecte}" class="alert alert-info">
                    Vous avez ete deconnecte.
                </div>

                <form th:action="@{/connexion}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="username" class="form-control" required autofocus/>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Mot de passe</label>
                        <input type="password" name="password" class="form-control" required/>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Se connecter</button>
                </form>

                <hr/>
                <p class="text-center small mb-1">Pas encore de compte ?</p>
                <div class="d-flex gap-2">
                    <a href="/inscription/client" class="btn btn-outline-secondary btn-sm w-50">Je suis client</a>
                    <a href="/inscription/professionnel" class="btn btn-outline-secondary btn-sm w-50">Je suis pro</a>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
