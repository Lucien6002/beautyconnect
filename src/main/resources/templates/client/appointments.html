<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Mes rendez-vous')}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<main class="flex-grow-1 container my-5">
    <h1 class="h4 mb-4">Mes rendez-vous</h1>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table mb-0 align-middle">
                <thead>
                <tr><th>Professionnel</th><th>Prestation</th><th>Date</th><th>Statut</th><th></th></tr>
                </thead>
                <tbody>
                <tr th:each="a : ${appointments}">
                    <td>
                        <a th:href="@{'/professionnels/' + ${a.professional.id}}" th:text="${a.professional.businessName}"></a>
                    </td>
                    <td th:text="${a.prestation.name}"></td>
                    <td th:text="${#temporals.format(a.timeSlot.startDateTime, 'dd/MM/yyyy HH:mm')}"></td>
                    <td>
                        <!-- Badge coloré selon le statut -->
                        <span th:switch="${a.status.name()}">
                            <span th:case="'EN_ATTENTE'" class="badge bg-warning text-dark">
                                <i class="bi bi-hourglass-split"></i> En attente
                            </span>
                            <span th:case="'CONFIRME'" class="badge bg-success">
                                <i class="bi bi-check-circle"></i> Confirmé
                            </span>
                            <span th:case="'REFUSE'" class="badge bg-danger">
                                <i class="bi bi-x-circle"></i> Refusé
                            </span>
                            <span th:case="'ANNULE'" class="badge bg-secondary">
                                <i class="bi bi-slash-circle"></i> Annulé
                            </span>
                            <span th:case="'TERMINE'" class="badge bg-primary">
                                <i class="bi bi-award"></i> Terminé
                            </span>
                        </span>
                    </td>
                    <td>
                        <a th:href="@{https://www.google.com/maps/dir/(api=1,destination=${a.professional.coordinatesPublic and a.professional.latitude != null and a.professional.longitude != null ? a.professional.latitude + ',' + a.professional.longitude : a.professional.city},travelmode='walking')}" class="btn btn-sm btn-outline-primary mb-2" target="_blank" rel="noopener noreferrer">Itinéraire à pied</a>
                        <form th:if="${a.status.name() == 'EN_ATTENTE' or a.status.name() == 'CONFIRME'}"
                              th:action="@{'/rendez-vous/' + ${a.id} + '/annuler'}" method="post"
                              onsubmit="return confirm('Annuler ce rendez-vous ?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Annuler</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
            <div class="p-5 text-center" th:if="${#lists.isEmpty(appointments)}">
                <i class="bi bi-calendar2-heart display-4 text-muted mb-3 d-block"></i>
                <h3 class="h5 text-secondary">Vous n'avez aucun rendez-vous pour le moment</h3>
                <p class="text-muted small mb-4">Envie d'une nouvelle coiffure, d'un soin ou d'une manucure ?</p>
                <a href="/recherche" class="btn btn-primary">
                    <i class="bi bi-search"></i> Trouver un professionnel
                </a>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
