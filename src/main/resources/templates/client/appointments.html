<!doctype html>
<html
    lang="fr"
    xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
    <head th:replace="~{fragments/head :: head(title='Mon compte')}"></head>
    <body class="d-flex flex-column min-vh-100">
        <nav th:replace="~{fragments/navbar :: navbar}"></nav>
        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <div class="container bc-workspace" data-role="client">
            <aside
                th:replace="~{fragments/workspace :: navigation(role='client', active='appointments')}"
            ></aside>
            <main class="bc-workspace-main" id="main-content">
                <span class="bc-eyebrow">Votre espace client</span>
                <h1 class="h4 mb-4">Mes rendez-vous</h1>
                <!-- Rendez-vous a venir -->
                <div class="card shadow-sm p-4 mb-4">
                    <h2 class="h4 mb-3">Mes RDV à venir</h2>

                    <div
                        class="table-responsive"
                        th:unless="${#lists.isEmpty(upcoming)}"
                    >
                        <table class="table mb-0 align-middle">
                            <thead>
                                <tr>
                                    <th>Professionnel</th>
                                    <th>Prestation</th>
                                    <th>Date</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="a : ${upcoming}">
                                    <td>
                                        <a
                                            th:href="@{'/professionnels/' + ${a.professional.id}}"
                                            th:text="${a.professional.businessName}"
                                        ></a>
                                    </td>
                                    <td><span th:text="${a.prestation.name}"></span><p class="small text-muted mb-0" th:if="${!#strings.isEmpty(a.notes)}" th:text="'Votre message : ' + ${a.notes}"></p></td>
                                    <td
                                        th:text="${#temporals.format(a.timeSlot.startDateTime, 'dd/MM/yyyy HH:mm')}"
                                    ></td>
                                    <td>
                                        <a
                                            th:href="@{https://www.google.com/maps/dir/(api=1,destination=${a.professional.coordinatesPublic and a.professional.latitude != null and a.professional.longitude != null ? a.professional.latitude + ',' + a.professional.longitude : a.professional.city},travelmode='walking')}"
                                            class="btn btn-sm btn-outline-primary mb-2"
                                            target="_blank"
                                            rel="noopener noreferrer"
                                            >Itinéraire à pied</a
                                        >
                                        <form
                                            th:action="@{'/rendez-vous/' + ${a.id} + '/annuler'}"
                                            method="post"
                                            onsubmit="return confirm('Annuler ce rendez-vous ?');"
                                        >
                                            <button
                                                type="submit"
                                                class="btn btn-sm btn-outline-danger"
                                            >
                                                Annuler
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div th:if="${#lists.isEmpty(upcoming)}">
                        <p class="text-muted">
                            Vous n'avez pas encore pris de rdv.
                        </p>
                        <a href="/recherche" class="btn btn-primary"
                            >Prendre RDV</a
                        >
                    </div>
                </div>

                <!-- Historique : termines, annules et passes -->
                <div
                    class="card shadow-sm p-4"
                    th:unless="${#lists.isEmpty(history)}"
                >
                    <h2 class="h5 mb-3">Historique</h2>
                    <div class="table-responsive">
                        <table class="table mb-0 align-middle">
                            <thead>
                                <tr>
                                    <th>Professionnel</th>
                                    <th>Prestation</th>
                                    <th>Date</th>
                                    <th>Statut</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="a : ${history}">
                                    <td>
                                        <a
                                            th:href="@{'/professionnels/' + ${a.professional.id}}"
                                            th:text="${a.professional.businessName}"
                                        ></a>
                                    </td>
                                    <td><span th:text="${a.prestation.name}"></span><p class="small text-muted mb-0" th:if="${!#strings.isEmpty(a.notes)}" th:text="'Votre message : ' + ${a.notes}"></p></td>
                                    <td
                                        th:text="${#temporals.format(a.timeSlot.startDateTime, 'dd/MM/yyyy HH:mm')}"
                                    ></td>
                                    <td>
                                        <span th:switch="${a.status.name()}">
                                            <span
                                                th:case="'EN_ATTENTE'"
                                                class="badge bg-warning text-dark"
                                                >En attente</span
                                            >
                                            <span
                                                th:case="'CONFIRME'"
                                                class="badge bg-success"
                                                >Confirmé</span
                                            >
                                            <span
                                                th:case="'REFUSE'"
                                                class="badge bg-danger"
                                                >Refusé</span
                                            >
                                            <span
                                                th:case="'ANNULE'"
                                                class="badge bg-secondary"
                                                >Annulé</span
                                            >
                                            <span
                                                th:case="'TERMINE'"
                                                class="badge bg-primary"
                                                >Terminé</span
                                            >
                                        </span>
                                        <span class="d-block small text-muted" th:if="${reviewedAppointmentIds.contains(a.id)}">Avis déjà envoyé</span>
                                        <details class="bc-appointment-review" th:if="${a.status.name() == 'TERMINE' and !reviewedAppointmentIds.contains(a.id)}">
                                            <summary>Noter ce rendez-vous</summary>
                                            <form th:action="@{/avis/professionnels/{id}(id=${a.professional.id})}" method="post" class="mt-3">
                                                <input type="hidden" name="appointmentId" th:value="${a.id}"/>
                                                <label class="form-label" th:for="'rating-' + ${a.id}">Votre note sur 5</label>
                                                <select name="rating" th:id="'rating-' + ${a.id}" class="form-select mb-2" required>
                                                    <option value="">Choisir une note</option>
                                                    <option value="5">5 — Excellent</option><option value="4">4 — Très bien</option><option value="3">3 — Correct</option><option value="2">2 — Décevant</option><option value="1">1 — Mauvais</option>
                                                </select>
                                                <label class="form-label" th:for="'comment-' + ${a.id}">Commentaire (facultatif)</label>
                                                <textarea name="comment" th:id="'comment-' + ${a.id}" maxlength="1000" class="form-control mb-2" rows="3"></textarea>
                                                <button class="btn btn-sm btn-primary" type="submit">Publier mon avis</button>
                                            </form>
                                        </details>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>

        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </body>
</html>
