<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Mes favoris')}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<main class="flex-grow-1 container my-5">
    <div class="row g-4">
        <div class="col-lg-4">
            <aside th:replace="~{fragments/client-account :: sidebar('favoris')}"></aside>
        </div>

        <div class="col-lg-8">
            <div class="card shadow-sm p-4">
                <h2 class="h4 mb-3">Mes favoris</h2>

                <ul class="list-group list-group-flush" th:unless="${#lists.isEmpty(favorites)}">
                    <li class="list-group-item d-flex justify-content-between align-items-center px-0"
                        th:each="p : ${favorites}">
                        <div>
                            <a class="fw-semibold" th:href="@{'/professionnels/' + ${p.id}}" th:text="${p.businessName}"></a>
                            <div class="small text-muted"><i class="bi bi-geo-alt"></i> <span th:text="${p.city}"></span></div>
                        </div>
                        <div class="d-flex gap-2">
                            <a class="btn btn-sm btn-dark" th:href="@{'/professionnels/' + ${p.id}}">Prendre RDV</a>
                            <form th:action="@{'/client/favoris/' + ${p.id} + '/retirer'}" method="post">
                                <input type="hidden" name="from" value="favoris"/>
                                <button type="submit" class="btn btn-sm btn-outline-danger">Retirer</button>
                            </form>
                        </div>
                    </li>
                </ul>

                <div th:if="${#lists.isEmpty(favorites)}">
                    <p class="text-muted">Vous n'avez pas encore de professionnel favori.</p>
                    <a href="/recherche" class="btn btn-dark">Trouver un professionnel</a>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
