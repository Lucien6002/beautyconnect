<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Mes prestations')}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<div class="container bc-workspace" data-role="professional">
<aside th:replace="~{fragments/workspace :: navigation(role='professional', active='services')}"></aside>
<main class="bc-workspace-main" id="main-content">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
        <h1 class="h4 mb-0">Mes prestations</h1>
        <a th:href="@{/pro/prestations/supprimees}" class="btn btn-sm btn-outline-secondary">
            Prestations supprimees <span class="badge text-bg-secondary" th:text="${removedCount}"></span>
        </a>
    </div>

    <div class="row g-4">
        <div class="col-xl-7">
            <div class="card shadow-sm">
                <div class="table-responsive">
                    <table class="table mb-0 align-middle">
                        <thead><tr><th>Nom</th><th>Type</th><th>Duree</th><th>Tarif</th><th></th></tr></thead>
                        <tbody>
                        <tr th:each="p : ${prestations}">
                            <td><img th:if="${!#lists.isEmpty(p.photos)}" th:src="${p.photos[0].photoUrl}" alt="" class="bc-service-thumb" width="64" height="64"/><strong th:text="${p.name}"></strong><a th:href="@{/pro/prestations/{id}/photos(id=${p.id})}" class="bc-photo-link"><i class="bi bi-images" aria-hidden="true"></i> Photos <span th:text="${#lists.size(p.photos)} + '/5'"></span></a></td>
                            <td><span class="badge text-bg-light border" th:text="${p.type}"></span></td>
                            <td th:text="${p.durationMinutes} + ' min'"></td>
                            <td th:text="${#numbers.formatDecimal(p.price, 1, 2)} + ' €'"></td>
                            <td><a class="btn btn-sm btn-outline-primary mb-2" th:href="@{/pro/prestations/{id}/modifier(id=${p.id})}">Modifier</a>
                                <form th:action="@{'/pro/prestations/' + ${p.id} + '/supprimer'}" method="post"
                                      onsubmit="return confirm('Retirer cette prestation ? Vous pourrez la restaurer depuis Prestations supprimees.');">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">Retirer</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                    <p class="p-3 text-muted small mb-0" th:if="${#lists.isEmpty(prestations)}">
                        Aucune prestation pour le moment. Ajoutez-en une pour commencer a recevoir des demandes.
                    </p>
                </div>
            </div>
        </div>

        <div class="col-xl-5">
            <div class="card shadow-sm">
                <div class="card-header bg-white"><h2 class="h6 mb-0">Ajouter une prestation</h2></div>
                <div class="card-body">
                    <form th:action="@{/pro/prestations}" th:object="${prestationForm}" method="post" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label class="form-label" for="name">Nom</label>
                            <input type="text" class="form-control" th:field="*{name}" placeholder="Ex : Balayage"
                                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"/>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="description">Description (optionnel)</label>
                            <textarea class="form-control" th:field="*{description}"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="type">Type</label>
                            <select class="form-select" th:field="*{type}">
                                <option th:each="t : ${types}" th:value="${t}" th:text="${t}"></option>
                            </select>
                        </div>
                        <div class="row g-2">
                            <div class="col-6">
                                <label class="form-label" for="durationMinutes">Duree (min)</label>
                                <input type="number" class="form-control" th:field="*{durationMinutes}" min="5"
                                       th:classappend="${#fields.hasErrors('durationMinutes')} ? 'is-invalid'"/>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('durationMinutes')}" th:errors="*{durationMinutes}"></div>
                            </div>
                            <div class="col-6">
                                <label class="form-label" for="price">Tarif (€)</label>
                                <input type="number" step="0.01" class="form-control" th:field="*{price}"
                                       th:classappend="${#fields.hasErrors('price')} ? 'is-invalid'"/>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                            </div>
                        </div>
                        <div class="mt-3"><label class="form-label" for="firstPhoto">Première photo (facultatif)</label><input id="firstPhoto" type="file" name="file" accept="image/jpeg,image/png" class="form-control"/><p class="form-text">JPEG ou PNG · 5 Mo maximum. Vous pourrez ensuite compléter la galerie.</p></div>
                        <button type="submit" class="btn btn-primary w-100 mt-3">Ajouter la prestation</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
