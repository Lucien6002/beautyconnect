<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Prestations supprimees')}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<div class="container bc-workspace" data-role="professional">
<aside th:replace="~{fragments/workspace :: navigation(role='professional', active='services')}"></aside>
<main class="bc-workspace-main" id="main-content">
    <a th:href="@{/pro/prestations}" class="small text-decoration-none">&larr; Retour a mes prestations</a>
    <h1 class="h4 mt-2 mb-2">Prestations supprimees</h1>
    <p class="text-muted small mb-4">
        Ces prestations ne sont plus proposees aux clients. Les rendez-vous deja pris restent dans votre historique.
        Restaurer une prestation la rend de nouveau visible et reservable.
    </p>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table mb-0 align-middle">
                <thead><tr><th>Nom</th><th>Type</th><th>Duree</th><th>Tarif</th><th></th></tr></thead>
                <tbody>
                <tr th:each="p : ${prestations}">
                    <td th:text="${p.name}"></td>
                    <td><span class="badge text-bg-light border" th:text="${p.type}"></span></td>
                    <td th:text="${p.durationMinutes} + ' min'"></td>
                    <td th:text="${#numbers.formatDecimal(p.price, 1, 2)} + ' €'"></td>
                    <td>
                        <form th:action="@{'/pro/prestations/' + ${p.id} + '/restaurer'}" method="post">
                            <button type="submit" class="btn btn-sm btn-outline-success">Restaurer</button>
                        </form>
                        <form th:action="@{/pro/prestations/{id}/supprimer-definitivement(id=${p.id})}" method="post" class="mt-2" onsubmit="return confirm('Supprimer définitivement cette prestation et ses photos ? Cette action est irréversible.');"><button type="submit" class="btn btn-sm btn-outline-danger">Supprimer définitivement</button></form>
                    </td>
                </tr>
                </tbody>
            </table>
            <p class="p-3 text-muted small mb-0" th:if="${#lists.isEmpty(prestations)}">
                Aucune prestation supprimee.
            </p>
        </div>
    </div>
</main>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
