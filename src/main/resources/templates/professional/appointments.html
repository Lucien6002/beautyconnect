<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Mes rendez-vous')}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<main class="flex-grow-1 container my-5">
    <h1 class="h4 mb-4">Rendez-vous recus</h1>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table mb-0 align-middle">
                <thead>
                <tr><th>Client</th><th>Prestation</th><th>Date</th><th>Notes</th><th>Statut</th><th>Actions</th></tr>
                </thead>
                <tbody>
                <tr th:each="a : ${appointments}">
                    <td>
                        <div th:text="${a.client.fullName}"></div>
                        <div class="small text-muted" th:text="${a.client.email}"></div>
                    </td>
                    <td th:text="${a.prestation.name}"></td>
                    <td th:text="${#temporals.format(a.timeSlot.startDateTime, 'dd/MM/yyyy HH:mm')}"></td>
                    <td class="small" th:text="${a.notes}"></td>
                    <td><span class="badge text-bg-secondary" th:text="${a.status}"></span></td>
                    <td>
                        <form th:if="${a.status.name() == 'CONFIRME'}" th:action="@{'/pro/rendez-vous/' + ${a.id} + '/terminer'}" method="post">
                            <button type="submit" class="btn btn-sm btn-outline-primary">Marquer termine</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
            <p class="p-3 text-muted small mb-0" th:if="${#lists.isEmpty(appointments)}">Aucun rendez-vous pour le moment.</p>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
