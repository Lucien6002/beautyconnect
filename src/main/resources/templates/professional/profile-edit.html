<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Modifier mon profil')}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<main class="flex-grow-1 container my-5" style="max-width: 640px;">
    <h1 class="h4 mb-4">Modifier mon profil professionnel</h1>

    <div class="card shadow-sm p-4 mb-4">
        <div class="mb-3">
            <label class="form-label fw-bold">Photo de profil</label>
            <div th:if="${professional.profilePhotoUrl != null}" class="mb-3">
                <img th:src="${professional.profilePhotoUrl}" alt="Photo de profil" class="img-thumbnail mb-2" style="max-width: 200px; max-height: 200px; border: 3px solid #6366f1;"/>
                <form th:action="@{/pro/profil/photo/delete}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Supprimer la photo</button>
                </form>
            </div>
            <div th:if="${professional.profilePhotoUrl == null}" class="alert alert-info small mb-2">
                <i class="bi bi-info-circle"></i> Ajoutez une photo de profil pour être plus visible sur la vitrine.
            </div>
            <form th:action="@{/pro/profil/photo/upload}" method="post" enctype="multipart/form-data">
                <input type="file" name="photo" accept="image/*" class="form-control"/>
                <button type="submit" class="btn btn-sm btn-primary mt-2">
                    <i class="bi bi-upload"></i> <span th:text="${professional.profilePhotoUrl != null ? 'Changer la photo' : 'Ajouter une photo'}"></span>
                </button>
            </form>
        </div>
    </div>

    <form th:action="@{/pro/profil}" method="post" class="card shadow-sm p-4">
        <div class="mb-3">
            <label class="form-label">Nom de l'activite</label>
            <input type="text" name="businessName" class="form-control" th:value="${professional.businessName}" required/>
        </div>
        <div class="mb-3">
            <label class="form-label">Presentation</label>
            <textarea name="bio" class="form-control" rows="4" th:text="${professional.bio}"></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Ville / quartier</label>
            <input type="text" name="city" class="form-control" th:value="${professional.city}" required/>
        </div>
        <div class="mb-3">
            <label class="form-label">Adresse</label>
            <input type="text" name="address" class="form-control" th:value="${professional.address}"/>
        </div>
        <div class="mb-3">
            <label class="form-label">Clientele visee</label>
            <select name="targetGender" class="form-select">
                <option th:each="g : ${genders}" th:value="${g}" th:text="${g}"
                        th:selected="${g == professional.targetGender}"></option>
            </select>
        </div>
        <p><a th:href="@{/pro/localisation}">Gérer mon point public sur la carte</a></p>
        <button type="submit" class="btn btn-primary w-100">Enregistrer</button>
    </form>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
