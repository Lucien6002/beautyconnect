<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
  <div th:fragment="alerts" class="container mt-3">
    <!-- Alerte de succès (utilise --bc-mint) -->
    <div th:if="${success != null or param.success != null}"
      class="alert alert-success alert-dismissible fade show d-flex align-items-center gap-2 shadow-sm" role="alert">
      <i class="bi bi-check-circle-fill fs-5 flex-shrink-0" aria-hidden="true"></i>
      <div class="flex-grow-1" th:text="${success != null ? success : 'Opération effectuée avec succès.'}"></div>
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fermer"></button>
    </div>

    <!-- Alerte d'erreur (utilise --bc-coral, jamais la couleur seule) -->
    <div th:if="${error != null or param.error != null}"
      class="alert alert-danger alert-dismissible fade show d-flex align-items-center gap-2 shadow-sm" role="alert">
      <i class="bi bi-exclamation-triangle-fill fs-5 flex-shrink-0" aria-hidden="true"></i>
      <div class="flex-grow-1"
        th:text="${error != null ? error : 'Une erreur est survenue. Veuillez vérifier votre saisie.'}"></div>
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fermer"></button>
    </div>
  </div>
</body>

</html>
