<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Inscription professionnel')}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<main class="flex-grow-1 py-5">
    <div class="container" style="max-width: 640px;">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h4 mb-1">Creer mon compte professionnel</h1>
                <p class="text-muted small mb-4">Votre profil sera visible publiquement apres validation par un administrateur.</p>

                <form th:action="@{/inscription/professionnel}" th:object="${professionalRegistrationForm}" method="post">
                    <h2 class="h6 text-uppercase text-secondary">Vos informations</h2>
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label">Prenom</label>
                            <input type="text" class="form-control" th:field="*{firstName}"
                                   th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid'"/>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Nom</label>
                            <input type="text" class="form-control" th:field="*{lastName}"
                                   th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid'"/>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" th:field="*{email}"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"/>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Telephone (optionnel)</label>
                            <input type="tel" class="form-control" th:field="*{phone}"/>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Mot de passe</label>
                            <input type="password" class="form-control" th:field="*{password}"
                                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"/>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        </div>
                    </div>

                    <h2 class="h6 text-uppercase text-secondary">Votre activite</h2>
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label">Nom de l'activite</label>
                            <input type="text" class="form-control" th:field="*{businessName}" placeholder="Ex : Sarah Coiffure &amp; Onglerie"
                                   th:classappend="${#fields.hasErrors('businessName')} ? 'is-invalid'"/>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('businessName')}" th:errors="*{businessName}"></div>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Presentation (optionnel)</label>
                            <textarea class="form-control" th:field="*{bio}" rows="3" placeholder="Parlez de votre parcours, votre specialite..."></textarea>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Ville / quartier</label>
                            <input type="text" class="form-control" th:field="*{city}"
                                   th:classappend="${#fields.hasErrors('city')} ? 'is-invalid'"/>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('city')}" th:errors="*{city}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Adresse (optionnel)</label>
                            <input type="text" class="form-control" th:field="*{address}"/>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Clientele visee</label>
                            <select class="form-select" th:field="*{targetGender}">
                                <option th:each="g : ${genders}" th:value="${g}" th:text="${g}"></option>
                            </select>
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn btn-primary w-100">Creer mon compte professionnel</button>
                        </div>
                    </div>
                </form>

                <p class="text-center small mt-3 mb-0">
                    Deja inscrit ? <a href="/connexion">Se connecter</a>
                </p>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
