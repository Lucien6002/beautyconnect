<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Modifier mon profil')}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<main class="flex-grow-1 container my-5" style="max-width: 640px;">
    <h1 class="h4 mb-4">Modifier mon profil professionnel</h1>

    <form th:action="@{/pro/profil}" method="post" class="card shadow-sm p-4">
        <div class="mb-3">
            <label class="form-label">Nom de l'activite</label>
            <input type="text" name="businessName" class="form-control" th:value="${professional.businessName}" required/>
        </div>
        <div class="mb-3">
            <label class="form-label">Presentation</label>
            <textarea name="bio" class="form-control" rows="4" th:text="${professional.bio}"></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Ville / quartier</label>
            <input type="text" name="city" class="form-control" th:value="${professional.city}" required/>
        </div>
        <div class="mb-3">
            <label class="form-label">Adresse</label>
            <input type="text" name="address" class="form-control" th:value="${professional.address}"/>
        </div>
        <div class="mb-3">
            <label class="form-label">Clientele visee</label>
            <select name="targetGender" class="form-select">
                <option th:each="g : ${genders}" th:value="${g}" th:text="${g}"
                        th:selected="${g == professional.targetGender}"></option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary w-100">Enregistrer</button>
    </form>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
