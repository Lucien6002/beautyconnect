<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Mon espace pro')}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<main class="flex-grow-1 container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h4 mb-0" th:text="'Bonjour, ' + ${professional.businessName}"></h1>
        <span class="badge" th:classappend="${professional.validated} ? 'text-bg-success' : 'text-bg-warning'"
              th:text="${professional.validated} ? 'Profil valide' : 'En attente de validation'"></span>
    </div>

    <div class="alert alert-warning" th:if="${!professional.validated}">
        Votre profil n'est pas encore visible dans les resultats de recherche publics. Un administrateur doit le valider.
    </div>

    <div class="row g-4 mb-4">
        <div class="col-md-3">
            <div class="card shadow-sm text-center p-3">
                <div class="display-6" th:text="${prestationsCount}"></div>
                <div class="text-muted small">Prestations actives</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card shadow-sm text-center p-3">
                <div class="display-6" th:text="${upcomingSlots}"></div>
                <div class="text-muted small">Creneaux disponibles</div>
            </div>
        </div>
        <div class="col-md-3">
            <a href="/pro/prestations" class="card shadow-sm text-center p-3 text-decoration-none">
                <i class="bi bi-list-check h3"></i>
                <div class="small">Gerer mes prestations</div>
            </a>
        </div>
        <div class="col-md-3">
            <a href="/pro/creneaux" class="card shadow-sm text-center p-3 text-decoration-none">
                <i class="bi bi-calendar-week h3"></i>
                <div class="small">Gerer mes creneaux</div>
            </a>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-white d-flex justify-content-between align-items-center">
            <h2 class="h5 mb-0">Derniers rendez-vous recus</h2>
            <a href="/pro/rendez-vous" class="btn btn-sm btn-outline-primary">Voir tout</a>
        </div>
        <div class="table-responsive">
            <table class="table mb-0 align-middle">
                <thead><tr><th>Client</th><th>Prestation</th><th>Date</th><th>Statut</th></tr></thead>
                <tbody>
                <tr th:each="a : ${appointments}">
                    <td th:text="${a.client.fullName}"></td>
                    <td th:text="${a.prestation.name}"></td>
                    <td th:text="${#temporals.format(a.timeSlot.startDateTime, 'dd/MM/yyyy HH:mm')}"></td>
                    <td><span class="badge text-bg-secondary" th:text="${a.status}"></span></td>
                </tr>
                </tbody>
            </table>
            <p class="p-3 text-muted small mb-0" th:if="${#lists.isEmpty(appointments)}">Aucun rendez-vous pour le moment.</p>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
