<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
  <footer th:fragment="footer" class="py-4 mt-auto"
    style="background-color: var(--bc-surface); border-top: 1px solid rgba(40, 31, 53, 0.08);">
    <div class="container text-center">
      <!-- Nom avec police Fraunces -->
      <p class="mb-1 fw-bold fs-5" style="font-family: var(--bc-font-titles); color: var(--bc-ink);">BeautyConnect</p>
      <p class="mb-1 small" style="color: var(--bc-muted);">
        Le carnet de quartier pour vos soins et prestations de beauté locales.
      </p>
      <p class="mb-0 small" style="color: var(--bc-muted);">
        &copy; 2026 BeautyConnect. Plateforme étudiante.
      </p>
    </div>

    <!-- Bootstrap 5 JS Bundle (nécessaire pour le burger navbar et la fermeture des alertes) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Script personnalisé de l'application -->
    <script th:src="@{/js/main.js}"></script>
  </footer>
</body>

</html>
