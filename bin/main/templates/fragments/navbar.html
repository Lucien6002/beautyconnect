<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>
  <nav th:fragment="navbar" class="navbar navbar-expand-lg sticky-top"
    style="background-color: var(--bc-surface); border-bottom: 1px solid rgba(40, 31, 53, 0.08);">
    <div class="container">
      <!-- Logo & Titre avec police Fraunces et couleur ink -->
      <a class="navbar-brand fw-bold" th:href="@{/}" style="font-family: var(--bc-font-titles); color: var(--bc-ink);">
        <i class="bi bi-scissors text-primary"></i> BeautyConnect
      </a>

      <!-- Bouton burger accessible sur mobile -->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"
        aria-controls="navMenu" aria-expanded="false" aria-label="Ouvrir le menu de navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navMenu">
        <!-- Liens principaux -->
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" th:href="@{/}">Accueil</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" th:href="@{/recherche}">Trouver un pro</a>
          </li>
          <li class="nav-item" sec:authorize="hasRole('CLIENT')">
            <a class="nav-link" th:href="@{/client/tableau-bord}">Mon espace</a>
          </li>
          <li class="nav-item" sec:authorize="hasRole('PROFESSIONAL')">
            <a class="nav-link" th:href="@{/pro/tableau-bord}">Mon espace pro</a>
          </li>
          <li class="nav-item" sec:authorize="hasRole('ADMIN')">
            <a class="nav-link" th:href="@{/admin/tableau-bord}">Administration</a>
          </li>
        </ul>

        <!-- Zone de connexion / profil -->
        <ul class="navbar-nav align-items-lg-center gap-2">
          <!-- Connecté -->
          <li class="nav-item" sec:authorize="isAuthenticated()">
            <span class="navbar-text me-2 small text-muted">
              <i class="bi bi-person-circle me-1"></i>
              <span sec:authentication="name">Utilisateur</span>
            </span>
          </li>
          <li class="nav-item" sec:authorize="isAuthenticated()">
            <form th:action="@{/deconnexion}" method="post" class="d-inline">
              <button type="submit" class="btn btn-outline-primary btn-sm">Déconnexion</button>
            </form>
          </li>

          <!-- Visiteur anonyme -->
          <li class="nav-item" sec:authorize="isAnonymous()">
            <a class="btn btn-outline-primary" th:href="@{/connexion}">Connexion</a>
          </li>
          <li class="nav-item" sec:authorize="isAnonymous()">
            <a class="btn btn-primary" th:href="@{/inscription/client}">Inscription</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</body>

</html>
