<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Mes rendez-vous')}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<main class="flex-grow-1 container my-5">
    <h1 class="h4 mb-4">Mes rendez-vous</h1>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table mb-0 align-middle">
                <thead>
                <tr><th>Professionnel</th><th>Prestation</th><th>Date</th><th>Statut</th><th></th></tr>
                </thead>
                <tbody>
                <tr th:each="a : ${appointments}">
                    <td>
                        <a th:href="@{'/professionnels/' + ${a.professional.id}}" th:text="${a.professional.businessName}"></a>
                    </td>
                    <td th:text="${a.prestation.name}"></td>
                    <td th:text="${#temporals.format(a.timeSlot.startDateTime, 'dd/MM/yyyy HH:mm')}"></td>
                    <td><span class="badge text-bg-secondary" th:text="${a.status}"></span></td>
                    <td>
                        <form th:if="${a.status.name() == 'EN_ATTENTE' or a.status.name() == 'CONFIRME'}"
                              th:action="@{'/rendez-vous/' + ${a.id} + '/annuler'}" method="post"
                              onsubmit="return confirm('Annuler ce rendez-vous ?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Annuler</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
            <p class="p-3 text-muted small mb-0" th:if="${#lists.isEmpty(appointments)}">
                Vous n'avez pas encore de rendez-vous.
            </p>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
