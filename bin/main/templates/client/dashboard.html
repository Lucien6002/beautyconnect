<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head(title='Mon espace')}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<main class="flex-grow-1 container my-5">
    <h1 class="h4 mb-4">Bonjour <span sec:authentication="name"></span> 👋</h1>

    <div class="row g-4 mb-4">
        <div class="col-md-4">
            <div class="card shadow-sm text-center p-3">
                <div class="display-6" th:text="${totalAppointments}"></div>
                <div class="text-muted">Rendez-vous au total</div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm text-center p-3">
                <a href="/recherche" class="btn btn-primary">Trouver un professionnel</a>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm text-center p-3">
                <a href="/client/rendez-vous" class="btn btn-outline-secondary">Voir tous mes rendez-vous</a>
            </div>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-white"><h2 class="h5 mb-0">Derniers rendez-vous</h2></div>
        <div class="table-responsive">
            <table class="table mb-0 align-middle">
                <thead><tr><th>Professionnel</th><th>Prestation</th><th>Date</th><th>Statut</th></tr></thead>
                <tbody>
                <tr th:each="a : ${appointments}">
                    <td th:text="${a.professional.businessName}"></td>
                    <td th:text="${a.prestation.name}"></td>
                    <td th:text="${#temporals.format(a.timeSlot.startDateTime, 'dd/MM/yyyy HH:mm')}"></td>
                    <td><span class="badge text-bg-secondary" th:text="${a.status}"></span></td>
                </tr>
                </tbody>
            </table>
            <p class="p-3 text-muted small mb-0" th:if="${#lists.isEmpty(appointments)}">
                Vous n'avez pas encore de rendez-vous. <a href="/recherche">Trouvez un professionnel</a> pour commencer.
            </p>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
