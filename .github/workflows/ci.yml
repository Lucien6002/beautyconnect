name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: beautyconnect_test
          POSTGRES_USER: audit
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U audit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configurer Gradle (avec cache)
        uses: gradle/actions/setup-gradle@v4
      - name: H2 journeys and PostgreSQL migrations
        run: bash gradlew --no-daemon test bootJar
        env:
          POSTGRES_TEST_URL: jdbc:postgresql://localhost:5432/beautyconnect_test
          POSTGRES_TEST_USER: audit
          POSTGRES_TEST_PASSWORD: ci-test-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: build/reports/tests/test
